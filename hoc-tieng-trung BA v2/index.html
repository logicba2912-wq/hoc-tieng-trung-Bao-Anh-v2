<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học Tiếng Trung</title>
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiếng Trung">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: thầy giáo kiên nhẫn, gọn gàng, khích lệ
IDEA: cuốn vở luyện chữ: giấy trắng, mực son đỏ chấm bài, ô chữ điền
PICTURE: chữ Hán lớn là nhân vật chính; hình miệng – lưỡi cho phát âm
COLOUR/TYPE: trắng giấy, mực đen, son đỏ, xanh ngọc chấm đúng; Be Vietnam Pro + chữ Hán hệ thống
LAYOUT: một cột cho điện thoại, thanh điều hướng dưới, thẻ bo tròn */
:root{color-scheme:light dark;--bg:light-dark(#fbfaf7,#141312);--card:light-dark(#fff,#1e1c1b);--ink:light-dark(#1d1b1a,#f1ece6);--mut:light-dark(#6d6761,#a8a29b);--line:light-dark(#e8e2da,#35312e);--red:light-dark(#c8102e,#ff5c61);--redbg:light-dark(#fdecee,#3a1a1c);--jade:light-dark(#0f7b5f,#3cc39a);--jadebg:light-dark(#e6f4ef,#14302a);--gold:light-dark(#b07b00,#f0c14b);--goldbg:light-dark(#fff6dc,#352b10);--t0:#8a8f98;--t1:light-dark(#2f6fd6,#6fa2ff);--t2:light-dark(#1f9a5a,#4fd08e);--t3:light-dark(#c47c00,#f0b23c);--t4:light-dark(#d23a2a,#ff6a5a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Be Vietnam Pro',system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.zh{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;font-weight:500}
#main{max-width:680px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.1;margin:0 0 4px;font-weight:800}h2{font-size:19px;margin:26px 0 10px}h3{font-size:17px;margin:0 0 8px}
.ph{margin:6px 0 16px}.ph p{margin:0;color:var(--mut)}.lh h1{font-size:clamp(26px,8.5vw,40px)}
.back{color:var(--red);text-decoration:none;font-weight:600;display:inline-block;padding:6px 0}
.muted{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.tip{background:var(--goldbg);border-color:transparent}
.hero .huge{font-size:52px;line-height:1.15;color:var(--red)}.hero .py{font-size:18px}.hero p{margin:6px 0}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}.prog i{display:block;height:100%;background:var(--jade);border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;border:0;background:var(--red);color:#fff;font:600 15px/1.2 'Be Vietnam Pro',system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:38px;padding:7px 12px;font-size:14px}.btn.wide{width:100%}.btn.danger{color:var(--red)}
.btn svg,.ib svg,.micbig svg{width:20px;height:20px;flex:none}
.btn:focus-visible,.ib:focus-visible,.chip:focus-visible,.opt:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.on,.ib.on{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.ib{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib.big{width:48px;height:48px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.sw{display:inline-flex;gap:6px;align-items:center;font-size:14px;min-height:40px}.sw input{width:20px;height:20px;accent-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;min-height:38px;font:500 14px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.chip.big{font-size:17px;padding:8px 14px}.chip.cur{border-color:var(--red);background:var(--redbg)}
.tag{background:var(--redbg);color:var(--red);font-size:12px;padding:1px 7px;border-radius:99px;font-weight:600}
.t0{color:var(--t0)}.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}
.py{color:var(--mut)}.vi{font-size:15px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.steps li a{flex:1;color:inherit;text-decoration:none;display:flex;flex-direction:column;padding:6px 0}.steps li a span{font-size:13px;color:var(--mut)}
.steps em{font-style:normal;color:var(--mut);font-size:14px}
.steps li.done{background:var(--jadebg);border-color:transparent}.steps li.done b{text-decoration:line-through;text-decoration-color:var(--jade)}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer;padding:0}
.done .ck{background:var(--jade);border-color:var(--jade)}.ck svg{width:18px;height:18px}
.lessons{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lessons a{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit;text-decoration:none}
.lessons .zh{display:block;font-size:20px}.lessons small{color:var(--mut)}.lessons .st{margin-left:auto;color:var(--mut);font-size:14px}.lessons .st svg{width:22px;color:var(--jade)}
.lessons li.cur a{border-color:var(--red)}
.no{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--redbg);color:var(--red);font-weight:800;font-size:14px;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px;padding:4px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{flex:none;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font:600 14px 'Be Vietnam Pro',sans-serif;background:var(--card);cursor:pointer;min-height:40px}
.tabs .cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{position:static;margin:8px 0}
.words,.ex,.lines{list-style:none;padding:0;margin:0}
.words li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.words .acts{grid-column:1/-1;display:flex;gap:6px}
@media(min-width:520px){.words li{grid-template-columns:auto minmax(0,1fr) auto}.words .acts{grid-column:auto}}
.hz{font-size:34px;line-height:1.1;background:none;border:0;color:var(--ink);padding:4px 2px;min-width:64px;text-align:left;cursor:pointer}
.wm .py{font-size:17px}
.blur{filter:blur(6px);cursor:pointer}
.acts{display:inline-flex;gap:6px;flex-wrap:wrap}
.ex li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ex .zh{font-size:21px}.ex.big .zh{font-size:24px}
.gram h3{display:flex;gap:8px;align-items:center}
.dlg .lines li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 6px;border-radius:12px}
.dlg .lines li .acts{grid-column:2}
.dlg .lines li.now{background:var(--goldbg)}
.who{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--line);font-weight:800;font-size:13px}
.lines .zh{font-size:21px}
.slot{margin-top:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:14px}
.s3{background:var(--jadebg);color:var(--jade)}.s2{background:var(--goldbg);color:var(--gold)}.s1{background:var(--redbg);color:var(--red)}
.qz .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 15px 'Be Vietnam Pro',sans-serif;padding:8px;cursor:pointer}
.opt.right{background:var(--jadebg);border-color:var(--jade)}.opt.wrong{background:var(--redbg);border-color:var(--red)}
.good{color:var(--jade);font-weight:700;margin:8px 0 2px}.bad{color:var(--red);font-weight:700;margin:8px 0 2px}.warn{color:var(--red)}
.fb .zh{font-size:22px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh-in{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));position:relative}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:18px;cursor:pointer}
.ref{text-align:center;margin:8px 0}.zh.big{font-size:34px}.zh.mid{font-size:24px}.zh.giant{font-size:64px;line-height:1.1}
.ref .zh{cursor:pointer}
.micbig{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px auto;width:100%;max-width:320px;min-height:86px;border-radius:18px;border:0;background:var(--red);color:#fff;font:600 15px 'Be Vietnam Pro',sans-serif;cursor:pointer;padding:14px}
.micbig svg{width:32px;height:32px}.micbig.on{animation:pulse 1s infinite}
.res{text-align:center}.res .zh .ok{color:var(--jade)}.res .zh .bad{color:var(--red);text-decoration:underline}
.score{display:inline-flex;align-items:baseline;gap:4px;font-size:44px;font-weight:800;padding:2px 18px;border-radius:16px}.score small{font-size:14px}
.note{font-size:13px;color:var(--mut);text-align:center}
.syl{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sylh{display:flex;align-items:center;gap:14px}.sylh .big{font-size:30px;font-weight:800}
.how{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:420px){.how{grid-template-columns:minmax(0,1fr)}.how .mouth{max-width:200px}}
.how p{margin:6px 0;font-size:15px}.cap{font-size:13px;color:var(--mut);text-align:center;margin:2px 0}
.mouth{width:100%;height:auto;display:block}
.mbg{fill:light-dark(#f6efe6,#25211f)}.mcav{fill:light-dark(#f3d9d3,#4a2f2c)}.mpal{fill:none;stroke:light-dark(#9a6b60,#c79a8f);stroke-width:2.5}
.mteeth{fill:#fff;stroke:#bbb}.mlip{fill:light-dark(#e58c8c,#c96a6a)}.mtong{fill:light-dark(#d9536b,#e0647b)}.mdot{fill:none;stroke:var(--gold);stroke-width:3}
.mlab{font:9px 'Be Vietnam Pro',sans-serif;fill:var(--mut)}.mair{stroke:var(--t1);stroke-width:2;stroke-linecap:round}
.contour{width:60px;height:40px;vertical-align:middle}.cl{stroke:var(--line);stroke-width:1}.cp{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.t0s{stroke:var(--t0)}.t1s{stroke:var(--t1)}.t2s{stroke:var(--t2)}.t3s{stroke:var(--t3)}.t4s{stroke:var(--t4)}
.tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}.tone{margin:0}.tn{font-weight:800;font-size:18px}
.tone .contour{width:120px;height:80px}
.inis{display:grid;gap:10px}.ig{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:center;margin:0}
.chip sup{color:var(--t1);font-weight:800}
.fins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0}.fins dt{font-weight:800;color:var(--red)}.fins dd{margin:0}
.pairs{display:grid;gap:10px}.pair{margin:0;transition:box-shadow .3s}.pair.flash{box-shadow:0 0 0 3px var(--gold)}
.plain{padding-left:20px}.plain li{margin:8px 0}
.flash-card{text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash-card .front{display:flex;flex-direction:column;align-items:center;gap:10px}
.bk2{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}.py.big{font-size:22px}.vi.big{font-size:24px;font-weight:600}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.rate .r0{background:var(--red)}.rate .r1{background:var(--gold)}.rate .r2{background:var(--jade)}.rate .r3{background:var(--t1)}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}.boxes div{background:var(--bg);border-radius:10px;padding:8px}.boxes b{display:block;font-size:20px}.boxes span{font-size:12px;color:var(--mut)}
.roles{margin:8px 0}
.log{display:flex;flex-direction:column;gap:10px;min-height:200px;padding:6px 0 10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-color:var(--ink)}.msg.err{border-color:var(--red);color:var(--red)}
.msg.ai .zh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.msg .ib{width:36px;height:36px}
.fix{background:var(--goldbg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px}
.sug{display:block;margin-top:8px;text-align:left;border:1.5px dashed var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;font:500 15px 'Be Vietnam Pro',sans-serif;cursor:pointer;width:100%}
details summary{cursor:pointer;color:var(--mut);font-size:14px;min-height:32px;display:flex;align-items:center}
.typing{color:var(--mut)}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:8px 0}
.composer textarea{flex:1;font:16px 'Be Vietnam Pro',sans-serif;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);resize:none;min-height:48px}
select,input[type=password],input[list],textarea#bk{font:16px 'Be Vietnam Pro',sans-serif;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);width:100%;min-height:44px;margin-top:4px}
label{display:block;margin:8px 0;font-size:15px}input[type=range]{width:100%;accent-color:var(--red);min-height:36px}
.kv{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav a{flex:1;max-width:136px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--mut);text-decoration:none;font-size:11.5px;font-weight:600;min-height:58px}
#nav a .zh{font-size:21px;line-height:1.2}#nav a.cur{color:var(--red)}
.gear{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;z-index:21}
.gear svg{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;text-align:center}
#toast.show{opacity:1}
.wtarget{width:min(280px,100%);aspect-ratio:1;margin:10px auto;border:1.5px solid var(--line);border-radius:12px;background:var(--card) linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat;position:relative}
.wtarget::after{content:'';position:absolute;inset:0;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat;pointer-events:none}

.struct{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--jadebg);border-radius:10px;padding:8px 12px;margin:6px 0 8px}.struct span{font-size:12px;font-weight:700;color:var(--jade);text-transform:none}.struct b{font-size:16px;font-weight:600}
.wrong{display:flex;gap:10px;align-items:flex-start;background:var(--redbg);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}.wrong s{color:var(--red)}.wrong .tag{white-space:nowrap}.wrong small{color:var(--mut)}
.exhd{display:flex;align-items:center;gap:10px}.exhd .prog{flex:1;margin:0}
.ex1 .opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px}.ex1 .opt.zh{font-size:20px}
.blank{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--red);color:var(--red);text-align:center}
.big2{font-size:19px;font-weight:600}
.ans{min-height:58px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tile{min-height:46px;min-width:46px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.tile.on{background:var(--goldbg);border-color:var(--gold)}.tile:disabled{opacity:.25}
.fbk{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
#exNext{margin-top:12px}
@media(prefers-reduced-motion:reduce){.btn.on,.ib.on,.micbig.on{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="main"><p style="padding:40px 0">Đang tải bài học…</p></main>
<a class="gear" href="#caidat" aria-label="Cài đặt"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a>
<nav id="nav" aria-label="Điều hướng chính">
 <a href="#today" data-r="today"><span class="zh">今</span>Hôm nay</a>
 <a href="#bai" data-r="bai"><span class="zh">课</span>Bài học</a>
 <a href="#phatam" data-r="phatam"><span class="zh">音</span>Phát âm</a>
 <a href="#on" data-r="on"><span class="zh">卡</span>Ôn tập</a>
 <a href="#ai" data-r="ai"><span class="zh">说</span>Nhập vai</a>
</nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="tok.js"></script>
<script src="app.js"></script>
</body>
</html>
